
<div class="crear-container">

  <div class="page-header">
    <h1>Nuevo empleado</h1>
    <p>Registra un nuevo empleado y crea su cuenta de acceso.</p>
  </div>

  <div class="form-card">
    <form (ngSubmit)="crearEmpleado()">

      <h2>Información personal</h2>

      <div class="form-group">
        <label for="nombreCompleto">Nombre completo</label>
        <input
          type="text"
          id="nombreCompleto"
          name="nombreCompleto"
          [(ngModel)]="nuevoEmpleado.nombreCompleto"
          required>
      </div>

      <div class="form-group">
        <label for="correoElectronico">Correo electrónico</label>
        <input
          type="email"
          id="correoElectronico"
          name="correoElectronico"
          [(ngModel)]="nuevoEmpleado.correoElectronico"
          required>
      </div>

      <div class="form-group">
        <label for="puesto">Puesto</label>
        <input
          type="text"
          id="puesto"
          name="puesto"
          [(ngModel)]="nuevoEmpleado.puesto"
          placeholder="Ej. Desarrollador web"
          required>
      </div>

      <h2>Cuenta de acceso</h2>

      <div class="form-group">
        <label for="username">Nombre de usuario</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          minlength="4"
          required>
      </div>

      <h2>Asignaciones</h2>

      <div class="form-group">
        <label for="proyectos">Proyectos</label>
        <select
          id="proyectos"
          name="proyectos"
          multiple
          [(ngModel)]="nuevoEmpleado.proyectosId">

          @for (proyecto of proyectos; track proyecto.id) {
            <option [ngValue]="proyecto.id">{{ proyecto.nombre }}</option>
          }

        </select>
        <small>Mantén pulsada la tecla Ctrl para seleccionar varios.</small>
      </div>

      <div class="form-group">
        <label for="tareas">Tareas</label>
        <select
          id="tareas"
          name="tareas"
          multiple
          [(ngModel)]="nuevoEmpleado.tareasId">

          @for (tarea of tareas; track tarea.id) {
            <option [ngValue]="tarea.id">{{ tarea.titulo }}</option>
          }

        </select>
        <small>Mantén pulsada la tecla Ctrl para seleccionar varias.</small>
      </div>

      <div class="form-actions">
        <button type="button" class="cancel-button" (click)="cancelar()">
          Cancelar
        </button>

        <button type="submit" class="save-button">
          Crear empleado
        </button>
      </div>

    </form>
  </div>
</div>
