<div class="login-container">
    <div class="login-card">
        <h1>Bienvinid@ de nuevo</h1>
        <p>Introduce tus credenciales para acceder a la plataforma</p>

        <form (ngSubmit)="onLogin()">
            <div class="form-group">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" name="username" [(ngModel)]="username" placeholder="Introduce tu nombre de usuario" required/>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="Introduce tu contraseña" required/>
            </div>
            <button type="submit">Iniciar sesión</button>
        </form>
    </div>
</div>
